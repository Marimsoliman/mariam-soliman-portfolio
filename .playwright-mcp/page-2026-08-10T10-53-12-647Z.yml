  - contentinfo [ref=f8e919]:
    - generic [ref=f8e926]:
      - generic [ref=f8e927]: FAQ
      - heading "Got any questions?" [level=2] [ref=f8e928]
      - generic [ref=f8e929]:
        - generic [ref=f8e930]:
          - generic [ref=f8e931]:
            - button [ref=f8e932] [cursor=pointer]:
              - heading "Why Webflow instead of custom code?" [level=3] [ref=f8e933]
            - navigation "Why Webflow instead of custom code?":
              - paragraph [ref=f8e938]: Webflow gives you the best of both worlds. A platform your team can manage after launch, with the flexibility to build things that feel fully custom. I extend it with custom code and integrations so the result looks and performs like a fully coded site without needing a developer for every small change. For most businesses, that balance of control and independence is exactly what makes it worth it.
          - generic [ref=f8e939]:
            - button [ref=f8e940] [cursor=pointer]:
              - heading "Already have a Webflow site that needs work?" [level=3] [ref=f8e941]
            - navigation "Already have a Webflow site that needs work?":
              - paragraph [ref=f8e946]: That's a big part of what I do. Whether your site needs a structural cleanup, better performance, new sections, or a CMS overhaul, I can step in and improve what's already there. I'll audit what you have, identify what's holding it back, and build a clear plan to get it where it should be. You don't need to start from scratch to get a site that feels fast, clean, and easy to manage.
          - generic [ref=f8e947]:
            - button [ref=f8e948] [cursor=pointer]:
              - heading "What’s the process from start to launch?" [level=3] [ref=f8e949]
            - navigation "What’s the process from start to launch?":
              - paragraph [ref=f8e954]: It starts with a conversation about your goals, timeline, and what success looks like. From there I put together a clear scope and plan. Once we align, I build in stages and share progress as I go so nothing drifts and feedback stays easy. The goal is always a smooth handoff with a site you actually know how to use.
          - generic [ref=f8e955]:
            - button [ref=f8e956] [cursor=pointer]:
              - heading "Do you work under NDA?" [level=3] [ref=f8e957]
            - navigation "Do you work under NDA?":
              - paragraph [ref=f8e962]: Yes. I've worked on projects that required strict confidentiality, from pre-launch products to internal tools, and I treat every client's work with the same level of discretion. I'm happy to sign an NDA before we even start talking details. Trust is a big part of why clients keep coming back, and that extends to how I handle sensitive information.
        - generic [ref=f8e963]:
          - generic [ref=f8e964]:
            - button [ref=f8e965] [cursor=pointer]:
              - heading "Do you handle design, or only development?" [level=3] [ref=f8e966]
            - navigation "Do you handle design, or only development?":
              - paragraph [ref=f8e971]: Development is my core strength, but I'm not the kind of developer who needs every pixel handed to them. I have a strong eye for design and regularly collaborate with designers to refine layouts, spacing, and visual quality. If you have a design team, I'll work closely with them. If you're coming in with a rough direction, I can help shape things and bring in a designer from my network when needed.
          - generic [ref=f8e972]:
            - button [ref=f8e973] [cursor=pointer]:
              - heading "What does ongoing support look like?" [level=3] [ref=f8e974]
            - navigation "What does ongoing support look like?":
              - paragraph [ref=f8e979]: You get a dedicated block of development hours each month that you can use however you need. New sections, layout improvements, performance fixes, campaign updates, CMS changes. I work as an extension of your team, not someone you have to re-brief every time. Hours roll over for up to three months so nothing goes to waste, and we keep a running priority list so the most impactful work always gets done first. It's built for brands that want their site to keep evolving, not just sit there after launch.
          - generic [ref=f8e980]:
            - button [ref=f8e981] [cursor=pointer]:
              - heading "How do you handle revisions and feedback?" [level=3] [ref=f8e982]
            - navigation "How do you handle revisions and feedback?":
              - paragraph [ref=f8e987]: Revisions are built into the process, not an afterthought. I share progress at key stages so you can give feedback while it's easy to adjust, not after everything is locked in. I keep a tight feedback loop through Slack or whatever your team already uses. If something doesn't feel right, just say so. I'd rather refine something twice than launch something you're not proud of.
